# Hand-curated seed prompts for SELF-GENERATED CALIBRATION data.
#
# A deliberately small (20 prompt) set written by hand. GeneratedDataset
# auto-regressively generates calibration text from these prompts; that text can be
# mixed with Wikitext in the Calibration step.
#
# Disjoint from prompts/text_prompts.yaml (the evaluation set): sharing a
# prompt with the eval set would couple the calibration distribution to the
# eval distribution and optimistically bias quality metrics.
#
# Two prompts per category, mirroring the category mix of the eval set so the
# generated text stays representative of what the model is scored on.

# --- Factual knowledge ---
- What is a tsunami and what causes one?
- Who was Ada Lovelace and why is she remembered?

# --- Math and arithmetic ---
- A cyclist rides 18 km in 45 minutes. What is the average speed in km/h?
- Solve for y: 5y + 12 = 3y + 30.

# --- Reasoning and logic ---
- Four people must cross a river in a boat that holds two at a time. Describe how you would reason about finding the fastest crossing order.
- If every book on a shelf is either fiction or a biography, and no biography is fiction, what can you say about a book that is not a biography?

# --- Code generation ---
- Write a Python function that removes duplicate entries from a list while preserving order.
- Write a Python function that reads a CSV file and returns the mean of a named column.

# --- Creative writing ---
- Write a short story about a cartographer who finds a river missing from every map.
- Write a short poem about a train station at midnight.

# --- Translation ---
- Translate 'Could you please repeat that more slowly?' into French.
- Translate 'The library closes at eight' into Spanish.

# --- Summarization and analysis ---
- Explain the trade-offs between renting and buying a home in three paragraphs.
- Summarize the main differences between weather forecasting and climate modeling.

# --- Instruction following with constraints ---
- List exactly 4 steps for preparing a bicycle for winter storage. Use numbered points.
- Explain what a compiler does in no more than two sentences.

# --- Conversational and how-to ---
- What are some practical ways to reduce food waste at home?
- Explain step by step how to brew coffee with a pour-over cone.

# --- Edge cases for quantized models ---
- Continue this sequence: 1, 4, 9, 16, 25, ...
- Explain what a cache is using an analogy a non-technical person would understand.
