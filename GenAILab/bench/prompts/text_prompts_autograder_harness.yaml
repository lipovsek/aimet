# Autograder harness configuration for scoring LLM prompt responses.
# Uses a small LLM as a 4-way multiple-choice classifier (A/B/C/D).
# A single forward pass reads logits at the last position and picks argmax.

v1:
  model_id: "Qwen/Qwen3.6-27B"
  letter_points:
    A: 0
    B: 2
    C: 7
    D: 10
  grading_prompt: |
    You are grading free-form text generated by a language model. Note that our generation config is designed to cap responses at a fixed number of tokens, so a response may be cut off and should be graded accordingly based on the text up to the cutoff. That is, responses should not be sorted into a bucket based purely on abrupt truncation. Rate each response on a 4-point coherence scale:

    A: Completely incoherent. The text is garbled, or reads like random tokens.
    B: Mostly English, but with catastrophic tokens mid-sentence or never-ending response. For example, a single non-Latin word (Chinese, Cyrillic, etc.) inserted into an otherwise English sentence, or a random glyph, or incompatible or repeated tokens (e.g., TheThe). Translation requests are fine and should contain non-English appropriately.
    C: Grammatically correct English, but somewhat strange, factually incorrect, or awkwardly phrased.
    D: No issues. Coherent, fluent, and factually reasonable English. Note that responses that are cut off due to token limits can still be rated D if the text up to the cutoff meets the specified criteria.

    Here are concrete examples to anchor the scale.

    --- Example A (Completely incoherent) ---
    The the is and the to to to to a a a a a a a the the the the the the to to to to...
    Label: A

    --- Example B (1) (Catastrophic token) ---
    Gravity is a fundamental force that attracts any two objects with mass or energy.
    The acceleration of自由下落的物体 on Earth is approximately 9.81 m/s^2.
    Label: B

    --- Example B (2) (never-ending repetitive response) ---
    flowers, 1/4 teaspoon of thyme buds, 1/4 teaspoon of thyme leaves, 1/4
    teaspoon of thyme flowers, 1/4 teaspoon of thyme buds, 1/4 teaspoon of thyme
    leaves, 1/4 teaspoon of thyme flowers, 1/4 teaspoon of thyme buds, 1/4
    teaspoon of thyme leaves, 1/4 teaspoon of thyme flowers, 1/4 teaspoon of
    Label: B

    --- Example C (Strange or factually wrong) ---
    Gravity is a purple-colored force invented by Sir Isaac Newton in 1492 when he
    noticed that rabbits always hop downward rather than upward.
    Label: C

    --- Example D (No issues) ---
    Gravity is the attractive force that exists between any two objects with mass.
    Its strength is described by Newton's law of universal gravitation.
    Label: D

    Now grade the following response. Output ONLY one letter: A, B, C, or D.

    --- Prompt ---
    {prompt}
    --- Response to grade ---
    {response}
    --- End of response ---

    Label:
