# Autograder harness configuration for scoring VLM prompt responses.
# Uses a VLM as a 4-way multiple-choice classifier (A/B/C/D).
# The grader sees both the source image and the generated response.
# A single forward pass reads logits at the last position and picks argmax.

v1:
  model_id: "Qwen/Qwen3.6-27B"
  letter_points:
    A: 0
    B: 2
    C: 7
    D: 10
  grading_prompt: |
    You are grading a response generated by a vision-language model. You can see the original image that was shown to the model. Note that our generation config is designed to cap responses at a fixed number of tokens, so a response may be cut off and should be graded accordingly based on the text up to the cutoff. That is, responses should not be sorted into a bucket based purely on abrupt truncation. Rate the response on a 4-point scale:

    A: Completely incoherent. The text is garbled, random tokens, or entirely unrelated to the image.
    B: Mostly English, but with catastrophic failures. This includes: hallucinating objects clearly not in the image, catastrophic tokens mid-sentence, never-ending repetitive response, or describing a completely different scene than what is shown.
    C: Grammatically correct and somewhat relevant to the image, but with notable errors. This includes: misidentifying key objects, getting spatial relationships wrong, missing obvious visual details asked about, or providing vague descriptions that could apply to any image.
    D: No issues. The response correctly describes what is in the image, answers the question accurately based on visible content, and demonstrates genuine visual understanding. Note that responses that are cut off due to token limits can still be rated D if the text up to the cutoff meets the specified criteria.

    Here are concrete examples to anchor the scale.

    --- Example A (Completely incoherent) ---
    Prompt: Describe this image.
    Response: The the is and the to to to to a a a a a a a the the the the the the to to to to...
    Label: A

    --- Example B (1) (Hallucination) ---
    Prompt: What animals are in this image?
    Response: I can see three elephants and a giraffe standing near a waterfall.
    (When the image actually shows a dog in a backyard)
    Label: B

    --- Example B (2) (Never-ending repetitive response) ---
    Prompt: Describe this image.
    Response: The image shows a dog. The dog is brown. The dog is sitting. The dog is brown. The dog is sitting. The dog is brown. The dog is sitting. The dog is brown. The dog is sitting.
    Label: B

    --- Example C (Somewhat relevant but incorrect) ---
    Prompt: What breed of dog is this?
    Response: This appears to be a Golden Retriever with long flowing fur.
    (When the image actually shows a Labrador with short fur)
    Label: C

    --- Example D (No issues) ---
    Prompt: Describe this image.
    Response: The image shows a brown Labrador sitting on green grass in what appears to be a backyard. There is a wooden fence in the background and the dog appears relaxed.
    Label: D

    Now grade the following response. The image shown to you is the same image that was shown to the model being graded. Output ONLY one letter: A, B, C, or D.

    --- Prompt given to the model ---
    {prompt}
    --- Model's response ---
    {response}
    --- End of response ---

    Label:
