name: Setup AIMET build environment
description: Install build dependencies and create the AIMET build virtualenv

inputs:
  ver-python:
    description: 'Python version for the build virtualenv'
    required: false
    default: '3.10'
  ver-torch:
    description: 'Torch version pin (empty for non-torch builds)'
    required: false
    default: ''
  ver-onnxruntime:
    description: 'ONNX Runtime version pin (empty for non-onnx builds)'
    required: false
    default: ''
  ver-cuda:
    description: 'CUDA version (empty for CPU builds)'
    required: false
    default: ''
  virtual-env:
    description: 'Path of the virtualenv to create'
    required: false
    default: '/opt/venv'

runs:
  using: composite
  steps:
    - name: Install system dependencies and uv
      shell: bash
      run: scripts/posix/install_ubuntu_deps.sh

    - name: Configure build environment
      shell: bash
      run: |
        set -x
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "PYTHONPYCACHEPREFIX=/tmp" >> $GITHUB_ENV
        echo "UV_HTTP_TIMEOUT=300" >> $GITHUB_ENV
        echo "VIRTUAL_ENV=${{ inputs.virtual-env }}" >> $GITHUB_ENV
        git config --global --add safe.directory '*'

    - name: Create build virtualenv
      shell: bash
      run: |
        set -x
        VENV="${{ inputs.virtual-env }}"
        sudo mkdir -p "$VENV"
        sudo chown -R "$(id -u):$(id -g)" "$VENV"
        uv venv --python "${{ inputs.ver-python }}" "$VENV"
        # The job may run as a different user than the one that built the venv.
        chmod -R 777 "$VENV"
        echo "$VENV/bin" >> $GITHUB_PATH

    - name: Install AIMET build dependencies
      shell: bash
      run: |
        set -x
        VENV="${{ inputs.virtual-env }}"
        VER_TORCH="${{ inputs.ver-torch }}"
        VER_ONNXRUNTIME="${{ inputs.ver-onnxruntime }}"
        VER_CUDA="${{ inputs.ver-cuda }}"

        # Pin the framework versions the wheel is built against.
        {
          printf 'torch%s\n' "${VER_TORCH:+==$VER_TORCH}"
          printf 'onnxruntime%s\n' "${VER_ONNXRUNTIME:+==$VER_ONNXRUNTIME}"
          printf 'onnxruntime-gpu%s\n' "${VER_ONNXRUNTIME:+==$VER_ONNXRUNTIME}"
        } > /tmp/constraints.txt

        # The dynamic-metadata plugin (packaging/plugins/local/aimet.py) reads
        # CMAKE_ARGS to decide which variant's dependencies to resolve.
        export CMAKE_ARGS="\
          -DENABLE_TORCH=$([ -z "$VER_TORCH" ]; echo $?) \
          -DENABLE_ONNX=$([ -z "$VER_ONNXRUNTIME" ]; echo $?) \
          -DENABLE_CUDA=$([ -z "$VER_CUDA" ]; echo $?) \
        "

        TORCH_INDEX="https://download.pytorch.org/whl/$(echo "$VER_CUDA" | awk -F'.' '{print ($1!="")? "cu"$1$2 : "cpu"}')"

        export PIP_NO_CACHE_DIR=1
        uv pip compile --python="$VENV/bin/python" \
          --output-file=/tmp/requirements.txt \
          --constraint=/tmp/constraints.txt \
          --extra=dev \
          --extra=test \
          --extra=docs \
          --extra-index-url="$TORCH_INDEX" \
          --index-strategy unsafe-best-match \
          pyproject.toml

        uv pip install --python="$VENV/bin/python" \
          -r /tmp/requirements.txt \
          --extra-index-url="$TORCH_INDEX" \
          --index-strategy unsafe-best-match
