################################################################################
# Composite Action: Start Ephemeral GPU Runner
################################################################################
# Submits an Argo Workflow to the MLOps cluster that starts a GPU pod and
# registers it as a GitHub Actions ephemeral runner. Uses launch_pod.sh for
# Argo submission and pod readiness polling.
#
# The registration token is injected as a Kubernetes secret after the pod
# starts, so scheduling delays do not expire the token.
#
# Usage:
#   steps:
#     - uses: actions/checkout@v4
#     - name: Start runner
#       id: runner
#       uses: ./.github/actions/start-gpu-runner
#       with:
#         runner-id: my-job-${{ github.run_id }}
#         kubeconfig: ${{ secrets.KUBECONFIG }}
#         pat-token: ${{ secrets.SOURCE_REPO_PAT }}
################################################################################

name: Start GPU Runner
description: Start an ephemeral GPU runner on the MLOps cluster

inputs:
  runner-id:
    description: 'Unique ID for this runner. Used as the Argo workflow name, GitHub runner name, and runner label.'
    required: true
  gpu-request:
    description: 'Number of GPUs to request'
    required: false
    default: "1"
  cpu-request:
    description: 'Number of CPUs to request'
    required: false
    default: "4"
  memory-request:
    description: 'Memory to request (e.g. 80Gi)'
    required: false
    default: "80Gi"
  docker-image:
    description: 'Docker image for the runner pod'
    required: false
    default: "docker-registry.qualcomm.com/library/nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04"
  argo-namespace:
    description: 'Argo namespace'
    required: false
    default: "aihub"
  kubeconfig:
    description: 'Kubeconfig file contents for cluster access'
    required: true
  pat-token:
    description: 'GitHub PAT for runner registration'
    required: true

outputs:
  runner-label:
    description: 'The label to use in runs-on for the GPU job'
    value: ${{ steps.start.outputs.runner-label }}

runs:
  using: composite
  steps:
    - name: Install Argo CLI and kubectl
      shell: bash
      run: bash scripts/kube/install_deps.sh

    - name: Configure cluster access
      shell: bash
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG_DATA" > ~/.kube/config
        chmod 600 ~/.kube/config
      env:
        KUBECONFIG_DATA: ${{ inputs.kubeconfig }}

    - name: Start runner via launch_pod.sh
      id: start
      shell: bash
      run: |
        bash scripts/kube/launch_pod.sh \
          --template github-actions-runner \
          --name "${{ inputs.runner-id }}" \
          --labels "workflows.argoproj.io/creator-email=aimet_bot.at.qualcomm.com,workflows.argoproj.io/creator-preferred-username=aimet_bot" \
          --output workflow \
          --wait-step ephemeral-runner \
          -c "${{ inputs.cpu-request }}" \
          -g "${{ inputs.gpu-request }}" \
          -m "${{ inputs.memory-request }}" \
          -p "runner-labels=${{ inputs.runner-id }}" \
          -p "run-id=${{ inputs.runner-id }}" \
          -p "docker-image=${{ inputs.docker-image }}" \
          -p "git-repo=${{ github.server_url }}/${{ github.repository }}" \
          -p "send-email-on-finish=false"

        echo "runner-label=${{ inputs.runner-id }}" >> "$GITHUB_OUTPUT"
      env:
        NAMESPACE: ${{ inputs.argo-namespace }}

    - name: Generate and inject runner registration token
      shell: bash
      run: |
        # Generate a fresh token now that the pod is running — the full
        # 1-hour validity window is available for runner registration.
        RESPONSE=$(curl -s -X POST \
          -H "Authorization: token ${{ inputs.pat-token }}" \
          -H "Accept: application/vnd.github+json" \
          "${{ github.api_url }}/repos/${{ github.repository }}/actions/runners/registration-token")
        TOKEN=$(echo "$RESPONSE" | jq -r '.token')
        if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
          echo "Failed to generate runner registration token"
          echo "$RESPONSE"
          exit 1
        fi
        echo "::add-mask::$TOKEN"

        # Create the Kubernetes secret that the pod is polling for
        kubectl create secret generic "runner-token-${{ inputs.runner-id }}" \
          -n "${{ inputs.argo-namespace }}" \
          --from-literal=token="$TOKEN"
      env:
        NAMESPACE: ${{ inputs.argo-namespace }}

    - name: Wait for runner to come online
      shell: bash
      run: |
        echo "Waiting for runner '${{ inputs.runner-id }}' to register with GitHub..."

        NUM_TRIES=20
        for i in $(seq 1 $NUM_TRIES); do
          STATUS=$(curl -s \
            -H "Authorization: token ${{ inputs.pat-token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runners?per_page=100" \
            | jq -r --arg name "${{ inputs.runner-id }}" '.runners[] | select(.name==$name) | .status')

          if [ "$STATUS" = "online" ]; then
            echo "Runner '${{ inputs.runner-id }}' is online!"
            kubectl delete secret "runner-token-${{ inputs.runner-id }}" \
              -n "${{ inputs.argo-namespace }}" --ignore-not-found || true
            exit 0
          fi
          echo "Attempt $i/$NUM_TRIES - runner not yet online (status: ${STATUS:-not found})"
          sleep 30
        done

        echo "Runner did not come online within 10 minutes after pod started"
        exit 1
