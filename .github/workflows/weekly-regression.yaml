name: Weekly Regression

on:
  schedule:
    - cron: '0 6 * * 6'  # Saturday 6 AM UTC

  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework to run'
        required: false
        type: choice
        options:
          - all
          - onnx
          - torch
        default: 'all'

      filter_model:
        description: "Filter models by substring (e.g., 'resnet' matches resnet50)"
        required: false
        type: string
        default: ''

      filter_test:
        description: "Filter tests by substring (e.g., 'quantsim' matches quantsim_int8)"
        required: false
        type: string
        default: ''

      baseline_source:
        description: 'Branch to compare baseline against'
        required: false
        type: choice
        options:
          - own
          - develop
          - previous-release
          - custom
        default: 'own'

      baseline_source_custom:
        description: 'Custom branch name (only used when baseline_source is "custom")'
        required: false
        type: string
        default: ''

jobs:
  #=============================================================================
  # Build AIMET wheels (parallel builds)
  #=============================================================================
  build-aimet-onnx-gpu:
    name: Build AIMET (ONNX + GPU)
    if: ${{ github.repository_owner != 'qualcomm' && github.event.inputs.framework != 'torch' }}
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"onnx-gpu",
          "VER_PYTHON":"3.12",
          "VER_ONNXRUNTIME":"1.19.2",
          "VER_CUDA":"12.6.3",
          "ENABLE_TESTS":"ON",
          "PIP_INDEX":""
        }]}
    secrets: inherit

  build-aimet-torch-gpu:
    name: Build AIMET (Torch + GPU)
    if: ${{ github.repository_owner != 'qualcomm' && github.event.inputs.framework != 'onnx' }}
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"torch-gpu",
          "VER_PYTHON":"3.12",
          "VER_TORCH":"2.*",
          "VER_CUDA":"12.6.3",
          "ENABLE_TESTS":"OFF",
          "PIP_INDEX":""
        }]}
    secrets: inherit

  #=============================================================================
  # ONNX Weekly Regression (GPU Runner 1)
  #=============================================================================
  onnx-weekly:
    name: Run ONNX Weekly (GPU)
    needs: build-aimet-onnx-gpu
    if: ${{ github.repository_owner != 'qualcomm' && github.event.inputs.framework != 'torch' }}
    uses: ./.github/workflows/regression-gpu-job.yml
    with:
      framework: onnx
      runner-id: mlops-ci-gpu-small
      suite: weekly-onnx
      workflow-file: weekly-regression.yaml
      artifact-prefix: onnx-weekly
      enable-aihub: true
      filter-model: ${{ github.event.inputs.filter_model }}
      filter-test: ${{ github.event.inputs.filter_test }}
      baseline-source: ${{ github.event.inputs.baseline_source == 'custom' && github.event.inputs.baseline_source_custom || github.event.inputs.baseline_source || 'own' }}
    secrets: inherit

  #=============================================================================
  # Torch Weekly Regression (GPU Runner 2, runs in PARALLEL)
  #=============================================================================
  torch-weekly:
    name: Run Torch Weekly (GPU)
    needs: build-aimet-torch-gpu
    if: ${{ github.repository_owner != 'qualcomm' && github.event.inputs.framework != 'onnx' }}
    uses: ./.github/workflows/regression-gpu-job.yml
    with:
      framework: torch
      runner-id: mlops-ci-gpu-small
      suite: weekly-torch
      workflow-file: weekly-regression.yaml
      artifact-prefix: torch-weekly
      enable-aihub: true
      filter-model: ${{ github.event.inputs.filter_model }}
      filter-test: ${{ github.event.inputs.filter_test }}
      baseline-source: ${{ github.event.inputs.baseline_source == 'custom' && github.event.inputs.baseline_source_custom || github.event.inputs.baseline_source || 'own' }}
    secrets: inherit

  #=============================================================================
  # Results
  #=============================================================================
  results:
    name: Results
    needs:
      - build-aimet-onnx-gpu
      - build-aimet-torch-gpu
      - onnx-weekly
      - torch-weekly
    if: ${{ always() && github.repository_owner != 'qualcomm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ONNX comparison summary
        if: ${{ needs.onnx-weekly.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: onnx-weekly-comparison-summary
          path: summaries/onnx

      - name: Download Torch comparison summary
        if: ${{ needs.torch-weekly.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: torch-weekly-comparison-summary
          path: summaries/torch

      - name: Generate summary
        run: |
          python3 AIMETRegression/workflow/summary.py \
            --onnx-status "${{ needs.onnx-weekly.result }}" \
            --torch-status "${{ needs.torch-weekly.result }}" \
            --onnx-summary "summaries/onnx/comparison_summary.json" \
            --torch-summary "summaries/torch/comparison_summary.json" \
            --suite "weekly" \
            --trigger "${{ github.event_name }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Check failure signal
        id: check_signal
        env:
          BUILD_ONNX_RESULT: ${{ needs.build-aimet-onnx-gpu.result }}
          BUILD_TORCH_RESULT: ${{ needs.build-aimet-torch-gpu.result }}
          ONNX_RESULT: ${{ needs.onnx-weekly.result }}
          TORCH_RESULT: ${{ needs.torch-weekly.result }}
        run: |
          # Toggle: notify Slack on a clean pass too. Set to false to silence
          # green runs while STILL alerting on every failure below.
          NOTIFY_ON_PASS=true

          # Earliest failed pipeline stage, in execution order. "skipped" never
          # counts as failure, so framework-filtered manual runs don't misreport.
          FAILED_STAGE=""
          if [ "$BUILD_ONNX_RESULT" = "failure" ]; then
            FAILED_STAGE="AIMET build (ONNX)"
          elif [ "$BUILD_TORCH_RESULT" = "failure" ]; then
            FAILED_STAGE="AIMET build (Torch)"
          fi
          echo "failed_stage=$FAILED_STAGE" >> "$GITHUB_OUTPUT"

          HAS_FAILURES=false
          for f in summaries/onnx/comparison_summary.json summaries/torch/comparison_summary.json; do
            [ -f "$f" ] || continue
            [ "$(jq -r '.has_failures // false' "$f")" = "true" ] && HAS_FAILURES=true
          done
          echo "has_failures=$HAS_FAILURES" >> "$GITHUB_OUTPUT"

          # Any failure anywhere in the pipeline: build, runner startup, or the
          # regression jobs (job failure or per-test failures).
          ANY_FAILURE=false
          if [ -n "$FAILED_STAGE" ] || [ "$HAS_FAILURES" = "true" ] || [ "$ONNX_RESULT" = "failure" ] || [ "$TORCH_RESULT" = "failure" ]; then
            ANY_FAILURE=true
          fi

          # notify -> gates the P0 GitHub issue: regression failures only
          # (infra failures alert via Slack but don't open an issue).
          NOTIFY=false
          if [ "$HAS_FAILURES" = "true" ] || [ "$ONNX_RESULT" = "failure" ] || [ "$TORCH_RESULT" = "failure" ]; then
            NOTIFY=true
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            NOTIFY=false
          fi
          echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"

          # notify_slack -> gates the Slack post. Always on failure; on a clean
          # pass only when NOTIFY_ON_PASS is true. Scheduled runs only, to avoid
          # spamming manual dispatches.
          NOTIFY_SLACK=false
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$ANY_FAILURE" = "true" ] || [ "$NOTIFY_ON_PASS" = "true" ]; }; then
            NOTIFY_SLACK=true
          fi
          echo "notify_slack=$NOTIFY_SLACK" >> "$GITHUB_OUTPUT"

      - name: Generate issue body
        if: steps.check_signal.outputs.notify == 'true'
        run: |
          python3 AIMETRegression/workflow/issue_body.py \
            --onnx-summary "summaries/onnx/comparison_summary.json" \
            --torch-summary "summaries/torch/comparison_summary.json" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --suite "weekly" \
            --branch "${{ github.ref_name }}" \
            --title-out /tmp/issue_title.txt \
            > /tmp/issue_body.md

      - name: Create GitHub issue
        if: steps.check_signal.outputs.notify == 'true'
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('/tmp/issue_title.txt', 'utf8').trim();
            const body = fs.readFileSync('/tmp/issue_body.md', 'utf8');
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['p0', 'regression'],
            });
            core.setOutput('issue_url', data.html_url);

      - name: Generate Slack message
        if: steps.check_signal.outputs.notify_slack == 'true'
        id: slack_msg
        run: |
          MSG=$(python3 AIMETRegression/workflow/summary.py \
            --onnx-status "${{ needs.onnx-weekly.result }}" \
            --torch-status "${{ needs.torch-weekly.result }}" \
            --onnx-summary "summaries/onnx/comparison_summary.json" \
            --torch-summary "summaries/torch/comparison_summary.json" \
            --suite "weekly" \
            --trigger "${{ github.event_name }}" \
            --format slack \
            --branch "${{ github.ref_name }}" \
            --failed-stage "${{ steps.check_signal.outputs.failed_stage }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${{ steps.create_issue.outputs.issue_url }}" ]; then
            MSG="$MSG"$'\n'"Issue: ${{ steps.create_issue.outputs.issue_url }}"
          fi
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Slack
        if: steps.check_signal.outputs.notify_slack == 'true'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: C0898PQVA31  # #aimet
          slack-message: ${{ steps.slack_msg.outputs.message }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_TOKEN }}

