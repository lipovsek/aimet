name: PyPI release pipeline

on:
  workflow_call:
    inputs:
      variant-id:
        description: "Variant id whose prebuilt wheel to publish"
        required: true
        type: string
      deploy:
        description: "Deploy to official pypi if true"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish the ${{ inputs.variant-id }} wheel package
    runs-on: ubuntu-latest
    # Requires approval to publish wheels to PyPI from aimet-deployers
    environment: prod
    env:
      DEPLOY: ${{ inputs.deploy }}
    container:
      image: "ubuntu:22.04"
    steps:
      # The caller's nightly run already built and tested this wheel.
      - uses: actions/download-artifact@v4
        with:
          name: "${{ inputs.variant-id }}-wheel"
          path: "downloads"
      - run: |
          apt-get update
          apt-get install python3 python3-pip -y
          python3 -m pip install --upgrade pip
          python3 -m pip install twine
          python3 -m pip install --force-reinstall wheel
      - name: Create ~/.pypirc from secrets
        if: ${{ inputs.deploy }}
        run: |
          cat > ~/.pypirc <<'EOF'
          [testpypi]
          username = __token__
          password = ${{ secrets.TEST_PYPI_TOKEN }}

          [pypi]
          username = __token__
          password = ${{ secrets.PYPI_TOKEN }}
          EOF
      - name: Push to testpypi
        run: |
          # PyPI release does NOT have +cpu or +cu suffix
          export whl_file=$(\
              find downloads \
              -regextype posix-extended \
              -regex ".*aimet_(torch|onnx)-[0-9]+\.[0-9]+\.[0-9]+-.+.whl" \
          )

          case $DEPLOY in
          (true)
          echo "Deploy variable set to true, deploying. . . "
          twine upload --verbose --repository testpypi --config-file ~/.pypirc $whl_file
          ;;
          (false)
          echo "Deploy variable is false, deployment for twine upload --verbose --repository testpypi --config-file ~/.pypirc downloads/wheelhouse/* will not proceed."
          ;;
          esac
      - name: Push to pypi
        run: |
          # PyPI release does NOT have +cpu or +cu suffix
          export whl_file=$(\
              find downloads \
              -regextype posix-extended \
              -regex ".*aimet_(torch|onnx)-[0-9]+\.[0-9]+\.[0-9]+-.+.whl" \
          )

          case $DEPLOY in
          (true)
          echo "Deploy variable set to true, deploying. . . "
          twine upload --verbose --repository pypi --config-file ~/.pypirc $whl_file
          ;;
          (false)
          echo "Deploy variable is false, deployment for twine upload --verbose --repository pypi --config-file ~/.pypirc downloads/wheelhouse/* will not proceed."
          ;;
          esac
      - name: Clean up ~/.pypirc
        if: always()
        run: rm -f ~/.pypirc
