name: CI pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, release-* ]

# Cancel in-progress runs exclusively for PR jobs. `github.head_ref` is defined only for PRs,
# for post-merge, it defaults to `github.run_id`, which is guaranteed to be unique.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The internal repo and the public mirror (qualcomm/aimet) both live on
# github.com, so these jobs gate on the owner rather than the host: CI runs
# internally, where the self-hosted runners and secrets exist, and is skipped
# on the public mirror.
jobs:

  dco:
    if: github.repository_owner != 'qualcomm'
    uses: ./.github/workflows/dco.yml

  pipeline:
    if: github.repository_owner != 'qualcomm'
    needs: dco
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit
