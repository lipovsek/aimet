name: Build wheels

on:
  workflow_call:
    inputs:
      variants:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      build-windows-wheel:
        required: false
        type: boolean
        default: false

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.variants) }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    container:
      image: "${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_IMAGE }}-${{ matrix.id }}:${{ inputs.image-tag }}"
      credentials:
        username: ${{ secrets.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if tests should be run
        id: check_tests
        run: echo "status=${{ matrix.RUN_UNIT_TESTS == 'ON' || matrix.RUN_ACCEPTANCE_TESTS == 'ON' }}" >> $GITHUB_OUTPUT
      - name: "Generate CMAKE_ARGS"
        run: |
          set -x
          CMAKE_ARGS=""
          CMAKE_ARGS="-DENABLE_CUDA=$([ "${{ matrix.VER_CUDA }}" = "" ] && echo OFF || echo ON) $CMAKE_ARGS"
          CMAKE_ARGS="-DENABLE_TORCH=$([ "${{ matrix.VER_TORCH }}" = "" ] && echo OFF || echo ON) $CMAKE_ARGS"
          CMAKE_ARGS="-DENABLE_ONNX=$([ "${{ matrix.VER_ONNXRUNTIME }}" = "" ] && echo OFF || echo ON) $CMAKE_ARGS"
          CMAKE_ARGS="-DENABLE_TESTS=$([ ! ${{ steps.check_tests.outputs.status }} ] && echo OFF || echo ON) $CMAKE_ARGS"
          CMAKE_ARGS="-DPIP_INDEX=${{ matrix.PIP_INDEX }} $CMAKE_ARGS"
          echo "AIMET_CMAKE_ARGS=$CMAKE_ARGS" >> $GITHUB_ENV

          BUILD_TARGETS="${{ matrix.BUILD_TARGETS }}"
          echo "AIMET_BUILD_TARGETS=$BUILD_TARGETS" >> $GITHUB_ENV
      - name: "Exclude Torch libraries from dependencies for manylinux"
        if: matrix.VER_TORCH || matrix.VER_ONNXRUNTIME
        run: |
          . /etc/profile.d/conda.sh
          TORCH_DIR=$(python3 -c 'import torch; print(f"{torch.utils.cmake_prefix_path}/../../lib")')
          MANYLINUX_EXCLUDE_LIBS="$MANYLINUX_EXCLUDE_LIBS $(find $TORCH_DIR -name '*.so*' | xargs -r patchelf --print-soname | xargs -r printf -- '--exclude %s ')"
          set -x
          echo "MANYLINUX_EXCLUDE_LIBS=$MANYLINUX_EXCLUDE_LIBS" >> $GITHUB_ENV
      - name: "Exclude CUDA libraries from dependencies for manylinux"
        if: matrix.VER_CUDA
        run: |
          . /etc/profile.d/conda.sh
          CUDART_DIR=$(python3 -c 'import sysconfig ; from pathlib import Path; print(Path(sysconfig.get_config_var("prefix"), "lib"))')
          MANYLINUX_EXCLUDE_LIBS="$MANYLINUX_EXCLUDE_LIBS $(find $CUDART_DIR -name 'libcu*.so*' -o -name 'libnv*.so*' -o -name 'libnp*.so*' | xargs -r patchelf --print-soname | xargs -r printf -- '--exclude %s ')"
          set -x
          echo "MANYLINUX_EXCLUDE_LIBS=$MANYLINUX_EXCLUDE_LIBS" >> $GITHUB_ENV
      - name: "Exclude libpython libraries from dependencies for manylinux"
        run: |
          . /etc/profile.d/conda.sh
          LIBS_DIR=$(python3 -c 'import sysconfig ; from pathlib import Path; print(Path(sysconfig.get_config_var("prefix"), "lib"))')
          MANYLINUX_EXCLUDE_LIBS="$MANYLINUX_EXCLUDE_LIBS $(find $LIBS_DIR -name 'libpython*.so*' | xargs -r patchelf --print-soname | xargs -r printf -- '--exclude %s ')"
          set -x
          echo "MANYLINUX_EXCLUDE_LIBS=$MANYLINUX_EXCLUDE_LIBS" >> $GITHUB_ENV
      - name: "Build AIMET wheel package"
        run: |
          set -x
          rm -rf build dist
          . /etc/profile.d/conda.sh
          export CMAKE_ARGS="$AIMET_CMAKE_ARGS"
          export SKBUILD_BUILD_TARGETS="$AIMET_BUILD_TARGETS"

          python3 -m build --wheel --no-isolation .
          auditwheel repair --plat manylinux_2_34_x86_64 $MANYLINUX_EXCLUDE_LIBS dist/aimet*.whl

          if [ "${{ matrix.id }}" == "onnx-torch-cpu" ] ; then
            # Unzip aimet*.whl in current directory to upload Docs
            python3 -m pip install -t wheelhouse --no-deps wheelhouse/aimet*.whl
          fi
      - name: "Re-tag aimet-torch wheel files"
        if: matrix.VER_TORCH
        run: |
          set -x
          . /etc/profile.d/conda.sh
          python3 -m pip install --force-reinstall wheel
          wheel tags --remove --python-tag=py310 --abi-tag=none --platform-tag=any wheelhouse/aimet*.whl
          ls -al wheelhouse/
      - name: Upload AIMET wheel file
        uses: actions/upload-artifact@v3
        if: matrix.id != 'onnx-torch-cpu'
        with:
          name: "${{ matrix.id }}-wheel"
          path: |
            wheelhouse/aimet*.whl
          if-no-files-found: error
          retention-days: 30d
      - name: Upload compiled C++ unit tests
        uses: actions/upload-artifact@v3
        if: matrix.id != 'onnx-torch-cpu'
        with:
          name: "${{ matrix.id }}-tests"
          path: build/**/MoDl*Test
          if-no-files-found: error
          retention-days: 1d
      - name: Upload AIMET documentation
        if: matrix.id == 'onnx-torch-cpu'
        uses: actions/upload-artifact@v3
        with:
          name: Docs
          path: wheelhouse/Docs/
          if-no-files-found: error
          retention-days: 30d

  build-windows:
    runs-on: [self-hosted, Windows, X64]
    if: inputs.build-windows-wheel == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcpkg-triplet: x64-windows
            python-arch: amd64
            python-version: "3.10"
          - arch: arm64
            vcpkg-triplet: arm64-windows
            python-arch: arm64
            python-version: "3.12"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-env
        with:
          ENV_NAME: "onnx-cpu"
          VER_PYTHON: "${{ matrix.python-version }}"

      - name: "Download ARM64 Python for cross-compilation"
        if: matrix.arch == 'arm64'
        run: |
          # Download ARM64 Python nuget package for cross-compilation libs
          $pythonArm64Dir = Join-Path $env:GITHUB_WORKSPACE "python-arm64"
          New-Item -ItemType Directory -Force -Path $pythonArm64Dir

          # Download Python ARM64 nuget package (use .zip extension for Expand-Archive)
          $nugetZip = Join-Path $pythonArm64Dir "python.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/pythonarm64/${{ matrix.python-version }}" -OutFile $nugetZip

          # Extract the nuget package
          Expand-Archive -Path $nugetZip -DestinationPath $pythonArm64Dir -Force

          # Set environment variable for CMake to find ARM64 Python libs
          $pythonArm64Libs = Join-Path $pythonArm64Dir "tools/libs"
          $pythonArm64Include = Join-Path $pythonArm64Dir "tools/include"
          echo "PYTHON_ARM64_LIBS=$pythonArm64Libs" >> $env:GITHUB_ENV
          echo "PYTHON_ARM64_INCLUDE=$pythonArm64Include" >> $env:GITHUB_ENV

      - name: "Build AIMET ONNX-CPU wheel package for Windows (${{ matrix.arch }})"
        run: |

          # Activate uv environment
          .\onnx-cpu\Scripts\Activate.ps1

          # Bootstrap pip in the venv
          python -m ensurepip --upgrade

          python -m pip install uv

          # Install dev requirements
          python -m uv pip compile --output-file "$env:GITHUB_WORKSPACE\dev_requirements.txt" --extra dev pyproject.toml
          python -m uv pip install -r "$env:GITHUB_WORKSPACE\dev_requirements.txt"

          # Additional dependencies for windows build
          python -m uv pip install onnxruntime==1.19.2 onnx build pybind11

          # Install vcpkg if not present, then install Eigen3
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }
          & $vcpkgExe install eigen3:${{ matrix.vcpkg-triplet }}

          $vcpkgToolchain = (Join-Path $vcpkgRoot "scripts/buildsystems/vcpkg.cmake") -replace '\\','/'
          $env:CMAKE_TOOLCHAIN_FILE = $vcpkgToolchain

          # Set CMake args for ${{ matrix.arch }} Windows build
          $cmakeArgs = "-DENABLE_CUDA=OFF -DENABLE_TORCH=OFF -DENABLE_ONNX=ON -DENABLE_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain"

          # For ARM64 cross-compilation, point to ARM64 Python libs
          if ("${{ matrix.arch }}" -eq "arm64") {
            $pythonArm64Libs = $env:PYTHON_ARM64_LIBS -replace '\\','/'
            $pythonArm64Include = $env:PYTHON_ARM64_INCLUDE -replace '\\','/'
            $pythonLibName = "python" + "${{ matrix.python-version }}".Replace(".", "") + ".lib"
            $cmakeArgs = "$cmakeArgs -DPython3_LIBRARY=$pythonArm64Libs/$pythonLibName -DPython3_INCLUDE_DIR=$pythonArm64Include"
          }

          $cmakeArgs = "$cmakeArgs -DCMAKE_GENERATOR='Visual Studio 17 2022' -DCMAKE_GENERATOR_PLATFORM='${{ matrix.arch }}'"
          $env:CMAKE_ARGS = $cmakeArgs

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build, dist, wheelhouse
          New-Item -ItemType Directory -Force -Path wheelhouse

          # Build AIMET wheel
          python -m build --wheel --no-isolation .

      - name: "Re-tag wheel for ARM64 platform"
        if: matrix.arch == 'arm64'
        run: |
          .\onnx-cpu\Scripts\activate
          python -m pip install wheel

          # Re-tag the wheel from win_amd64 to win_arm64
          Get-ChildItem dist\aimet*.whl | ForEach-Object {
            python -m wheel tags --remove --platform-tag=win_arm64 $_.FullName
          }

          # Remove the original amd64 wheels
          Remove-Item dist\*win_amd64.whl -ErrorAction SilentlyContinue

          # Show the resulting wheels
          Get-ChildItem dist\

      - name: Upload AIMET Windows wheel file
        uses: actions/upload-artifact@v3
        with:
          name: "onnx-cpu-win-${{ matrix.arch }}-wheel"
          path: |
            dist/aimet*.whl
          if-no-files-found: error
          retention-days: 30d

