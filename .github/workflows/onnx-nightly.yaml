name: ONNX Nightly

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Testing mode'
        required: true
        type: choice
        options:
          - suite
          - single_test
          - suite_with_filter
        default: 'suite'

      suite:
        description: 'Test suite (suite, suite_with_filter modes)'
        required: false
        type: choice
        options:
          - nightly
          - smoke
          - weekly
          - release
        default: 'nightly'

      model:
        description: 'Model (single_test mode only)'
        required: false
        type: choice
        options:
          - resnet50
          - mobilenetv2
          - efficientnet_b0
          - densenet121
        default: 'resnet50'

      test:
        description: 'Test type (single_test mode only)'
        required: false
        type: choice
        options:
          - quantsim_int8
          - quantsim_int8_int16
          - lite_mp_25
          - adaround_500
        default: 'quantsim_int8'

      profile:
        description: 'Profile (single_test mode only)'
        required: false
        type: choice
        options:
          - nightly
          - none
        default: 'nightly'

      filter_model:
        description: 'Model filter (suite_with_filter mode only)'
        required: false
        type: string
        default: ''

      filter_test:
        description: 'Test filter (suite_with_filter mode only)'
        required: false
        type: string
        default: ''

jobs:
  #=============================================================================
  # Build AIMET wheel with ONNX and GPU support
  #=============================================================================
  build-aimet-onnx-gpu:
    name: Build AIMET (ONNX + GPU)
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"onnx-gpu",
          "runs-on":"k8s-gpu",
          "VER_PYTHON":"3.10",
          "VER_ONNXRUNTIME":"1.19.2",
          "VER_CUDA":"12.1.0",
          "ENABLE_TESTS":"ON",
          "PIP_INDEX":""
        }]}
      image-tag: latest
    secrets: inherit

  #=============================================================================
  # Run ONNX regression tests on GPU
  #=============================================================================
  onnx-gpu:
    name: Run ONNX Regression (GPU)
    needs: build-aimet-onnx-gpu
    runs-on: k8s-gpu

    container:
      image: "${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_IMAGE }}-onnx-gpu:latest"
      credentials:
        username: ${{ secrets.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_CREDENTIALS }}
      options: --gpus all

    timeout-minutes: 720

    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONUNBUFFERED: "1"
      INPUT_SUITE: ${{ github.event.inputs.suite || 'nightly' }}

    steps:
      #=========================================================================
      # Setup: Code and dependencies
      #=========================================================================

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache models and datasets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.qai_hub_cache
            ~/.qaihm
            ~/.cache/huggingface
            ~/.cache/torch
          # Cache key includes OS and hash of regression code
          # Restores previous cache if code unchanged, updates if changed
          key: aimet-cache-${{ runner.os }}-${{ hashFiles('ONNXRegression/**') }}
          restore-keys: aimet-cache-${{ runner.os }}-

      - name: Download AIMET wheel
        uses: actions/download-artifact@v3
        with:
          name: onnx-gpu-wheel
          path: downloads

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 git openssh-client unzip curl
          # Clean up to reduce image size
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Setup Python environment with UV
        run: |
          set -e

          # Install Python
          apt-get update -qq
          apt-get install -y python3.10 python3.10-venv python3.10-dev

          # Install UV for fast package installation
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          which uv
          uv --version
          echo "UV installed successfully"

          # Create virtual environment
          uv venv .venv --python python3.10
          . .venv/bin/activate

          # Install core packages
          uv pip install qai-hub qai-hub-models==0.43.0 # TODO: Remove after next QAI Hub Models release
          uv pip install onnxruntime-gpu==1.19.2
          uv pip install pynvml pytest requests

      - name: Install AIMET
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install downloads/*.whl
          python -c "import aimet_onnx; print('AIMET version:', aimet_onnx.__version__)"

      - name: Verify ONNX Runtime GPU
        run: |
          . .venv/bin/activate
          python -c "
          import onnxruntime as ort
          providers = ort.get_available_providers()
          print('ONNX Runtime providers:', providers)
          assert 'CUDAExecutionProvider' in providers
          "

      #=========================================================================
      # Configure AI Hub for on-device testing
      #=========================================================================

      - name: Configure AI Hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.AIMET_BOT_AIHUB_DEV_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m ONNXRegression.workflow.utils configure-aihub

      #=========================================================================
      # Baseline management: Download and setup previous baseline
      #=========================================================================

      - name: Download baseline from previous runs
        if: github.event.inputs.run_mode != 'single_test'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m ONNXRegression.workflow.artifacts download-baseline \
            --output-dir ONNXRegression/baselines/downloaded

      - name: Setup baseline for comparison
        if: github.event.inputs.run_mode != 'single_test'
        run: |
          . .venv/bin/activate
          python -m ONNXRegression.workflow.utils setup-baseline \
            --suite "${{ github.event.inputs.suite || 'nightly' }}"

      #=========================================================================
      # Run tests based on selected mode
      #=========================================================================

      - name: Run tests
        run: |
          . .venv/bin/activate
          MODE="${{ github.event.inputs.run_mode }}"
          MODE=${MODE:-suite}

          case "$MODE" in
            single_test)
              # Run single model+test combination for debugging
              python -m ONNXRegression.runner \
                --model "${{ github.event.inputs.model }}" \
                --test "${{ github.event.inputs.test }}" \
                --profile "${{ github.event.inputs.profile }}"
              ;;

            suite)
              # Run all tests in suite
              python -m ONNXRegression.suite_runner \
                --suite "${{ github.event.inputs.suite || 'nightly' }}"
              ;;

            suite_with_filter)
              # Run suite with model/test filters
              CMD="python -m ONNXRegression.suite_runner --suite ${{ github.event.inputs.suite || 'nightly' }}"
              [ -n "${{ github.event.inputs.filter_model }}" ] && CMD="$CMD --filter-model ${{ github.event.inputs.filter_model }}"
              [ -n "${{ github.event.inputs.filter_test }}" ] && CMD="$CMD --filter-test ${{ github.event.inputs.filter_test }}"
              eval "$CMD"
              ;;

            *)
              echo "Unknown mode: $MODE"
              exit 1
              ;;
          esac

      #=========================================================================
      # Baseline comparison and report generation
      #=========================================================================

      - name: Compare with baseline and generate report
        if: github.event.inputs.run_mode != 'single_test'
        run: |
          . .venv/bin/activate

          SUITE="${{ github.event.inputs.suite || 'nightly' }}"
          RESULTS_CSV="ONNXRegression/reports/results_${SUITE}.csv"

          if [ ! -f "$RESULTS_CSV" ]; then
            echo "Results CSV not found: $RESULTS_CSV"
            exit 1
          fi

          # Compare current results with previous baseline
          # Generates GitHub Actions summary with regressions/improvements
          python ONNXRegression/baseline_comparison.py run \
            --results "$RESULTS_CSV" \
            --suite-name "$SUITE" \
            --baselines-dir "ONNXRegression/baselines" \
            --github-summary \

      #=========================================================================
      # Generate environment lockfile for reproducibility
      #=========================================================================

      - name: Generate environment lockfile
        if: always()
        run: |
          . .venv/bin/activate
          # Add UV to PATH for pip freeze command
          export PATH="$HOME/.local/bin:$PATH"
          python -m ONNXRegression.workflow.utils generate-lockfile \
            --run-id "${{ github.run_id }}"

      - name: Generate timestamp for artifacts
        if: always()
        id: timestamp
        run: |
          echo "datetime=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate baseline artifact name
        if: github.event.inputs.run_mode != 'single_test'
        id: artifact_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          # Use artifacts.py to generate the correct name (handles sanitization)
          ARTIFACT_NAME=$(python -c "
          from ONNXRegression.workflow.artifacts import ArtifactManager, WorkflowConfig
          import os
          config = WorkflowConfig.from_env()
          manager = ArtifactManager(config)
          print(manager.get_artifact_name('${{ github.ref_name }}', '${{ github.event.inputs.suite || 'nightly' }}'))
          ")
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Generated artifact name: $ARTIFACT_NAME"

      #=========================================================================
      # Upload artifacts: Baseline and test reports
      #=========================================================================

      - name: Upload baseline artifact
        if: github.event.inputs.run_mode != 'single_test'
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ONNXRegression/baselines/latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-${{ steps.timestamp.outputs.datetime }}-${{ github.run_id }}
          path: ONNXRegression/reports/**/*
          retention-days: 30