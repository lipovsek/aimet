################################################################################
# Update Dependencies
################################################################################
# Checks pinned HuggingFace dependencies against PyPI daily and opens a PR
# if newer versions are available. This prevents surprise CI breakages from
# upstream HF releases by keeping pins explicit and updates intentional.
################################################################################

name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BUMP_BRANCH: auto/dep-bump

jobs:
  check-and-bump:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and configure GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh
          GH_HOST=$(echo "${{ github.server_url }}" | sed 's|https\?://||')
          gh auth login --hostname "$GH_HOST" --with-token <<< "$GH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing bump PR
        id: existing
        run: |
          PR_URL=$(gh pr list \
            --head "${{ env.BUMP_BRANCH }}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Existing bump PR found: $PR_URL — will update it."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check
        run: |
          python scripts/all/check_dep_updates.py \
            GenAILab/requirements-pinned.txt \
            --output /tmp/updated-pinned.txt

          if diff -q GenAILab/requirements-pinned.txt /tmp/updated-pinned.txt >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependencies are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Build a summary for the PR body
            diff --unified=0 GenAILab/requirements-pinned.txt /tmp/updated-pinned.txt \
              | tail -n +4 > /tmp/diff_summary.txt || true
          fi

      - name: Open or update PR
        if: steps.check.outputs.changed == 'true'
        run: |
          cp /tmp/updated-pinned.txt GenAILab/requirements-pinned.txt

          BRANCH="${{ env.BUMP_BRANCH }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and reset the branch if it already exists on the remote
          git fetch origin "$BRANCH" 2>/dev/null && git checkout "$BRANCH" && git reset --hard origin/develop || git checkout -b "$BRANCH"

          cp /tmp/updated-pinned.txt GenAILab/requirements-pinned.txt
          git add GenAILab/requirements-pinned.txt
          git commit -s -m "Update pinned package dependencies"
          git push -u origin "$BRANCH" --force-with-lease

          if [ "${{ steps.existing.outputs.found }}" = "true" ]; then
            echo "PR already exists — branch updated."
          else
            DIFF_BODY=$(cat /tmp/diff_summary.txt)
            gh pr create \
              --title "Update pinned package dependencies" \
              --body "$(cat <<EOF
          ## Summary
          Daily automated check found newer versions of pinned packages.

          \`\`\`diff
          ${DIFF_BODY}
          \`\`\`

          ## Test plan
          - [ ] CI passes with new versions
          - [ ] GenAI scorecard regression passes

          _Auto-generated by the update-dependencies workflow._
          EOF
          )" \
              --base develop \
              --label "dependencies"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
