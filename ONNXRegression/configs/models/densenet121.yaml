# DenseNet121 Model Configuration

# ==================== Model Identification ====================
model_name: densenet121

# ==================== Test Definitions ====================
tests:
  # --------------------------------------------------------------------------
  # Test 1: Standard INT8 Quantization
  # --------------------------------------------------------------------------

  - name: quantsim_int8
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    max_accuracy_drop_torch: 4.5
    max_accuracy_drop_onnx: 3.5