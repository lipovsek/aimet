suite_name: aimet_only
description: Run AIMET features (QuantSim, Lite-MP, etc.) with ORT accuracy only. No on-target (QNN).
include:
  - resnet50_quantsim.yaml
  - densenet121_quantsim.yaml
  - mobilenetv2_quantsim.yaml
  - mobilenetv2_litemp.yaml
  - dla102x_quantsim.yaml
  - efficientnet_b0_quantsim.yaml
  - mobilenet_v3_small_quantsim.yaml
  - mobilenet_v3_small_litemp.yaml
  - inception_v3_quantsim.yaml
  - nasnet_quantsim.yaml
  - resnext50_quantsim.yaml
  - shufflenet_v2_quantsim.yaml
  - swin_tiny_quantsim.yaml
  - convnext_tiny_quantsim.yaml
  - resnet50_litemp.yaml
  - mobilenetv2_litemp.yaml
  - resnet50_adaround.yaml
overrides:
  qnn_options: null          # delete any QNN options from the config
  qnn_eval_samples: 0        # ensure no on-target inference