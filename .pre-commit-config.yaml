
exclude: |
  (?x)(
      ^build/|
      ^Docs
  )

default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: (CMakeLists\.txt|Dockerfile.*|\.(sh|py|cmake)$)
        exclude: |
          (?x)^(
            build/.*|
            ThirdParty/.*|
          )$
        args:
            - --license-filepath
            - .pre-commit-license-header.txt
            - --allow-past-years
      - id: insert-license
        files: \.(c|cpp|h|hpp|cu|cuh|js)$
        exclude: |
          (?x)^(
            build/.*|
            ThirdParty/.*|
          )$
        args:
            - --license-filepath
            - .pre-commit-license-header.txt
            - --comment-style
            - //
            - --allow-past-years
      - id: insert-license
        files: \.rst$
        exclude: |
          (?x)^(
            build/.*|
            ThirdParty/.*|
          )$
        args:
            - --license-filepath
            - .pre-commit-license-header.txt
            - --comment-style
            - ".."
            - --allow-past-years
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: Jenkins/fast-release/environment.devenv.yml
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
    - id: ruff-format
      types_or: [ python, pyi ]
