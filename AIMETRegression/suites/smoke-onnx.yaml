# Smoke Test Suite - AIMET ONNX
#
# Lightweight suite for PR-level validation.
# Runs all models with quantsim_int8 only to verify loading and quantization work.

suite_name: smoke-onnx

description: >
  ONNX smoke test — runs quantsim_int8 on all models to verify nothing is broken.

profile: smoke

framework: onnx

models:
  - models/resnet50.yaml

test_filter:
  - quantsim_int8
  - quantsim_int8_int16
