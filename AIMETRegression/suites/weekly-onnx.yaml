  - models/resnext50.yaml
  - models/resnext101.yaml
  - models/regnet_y_800mf.yaml
  - models/mnasnet05.yaml
  - models/mobilenet_v3_small.yaml
  - models/nasnet.yaml
  - models/efficientnet_b4.yaml
  - models/efficientnet_v2_s.yaml
  # Classification - transformers
  - models/vit.yaml
  - models/swin_tiny.yaml
