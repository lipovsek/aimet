# Nightly Regression Suite - AIMET Torch
#
# Purpose: Fast daily regression to test AIMET Torch quantization
# Target Duration: 2-3 hours
# When: Every night at 6 AM UTC

suite_name: nightly-torch

description: >
  Fast daily regression to test AIMET Torch quantization.
  Runs on GPU only, no on-target testing.
  Target completion time: 2-3 hours.

profile: nightly

framework: torch

# Skip QNN on-device evaluation — nightly runs GPU-only, no workbench jobs.
config_overrides:
  qnn_options: null

models:
  # Classification - standard architectures
  - models/resnet50.yaml
  - models/mobilenetv2.yaml
  - models/efficientnet_b0.yaml
  - models/densenet121.yaml
  - models/mobilenet_v3_large.yaml
  - models/squeezenet1_1.yaml
  - models/inception_v3.yaml
  - models/convnext_tiny.yaml
  - models/regnetx_004.yaml
  - models/wideresnet50.yaml
  - models/shufflenet_v2.yaml
  - models/googlenet.yaml
  - models/resnet18.yaml
  - models/resnext50.yaml
  - models/resnext101.yaml
  - models/regnet_y_800mf.yaml
  - models/mnasnet05.yaml
  - models/mobilenet_v3_small.yaml
  - models/nasnet.yaml
  - models/efficientnet_b4.yaml
  - models/efficientnet_v2_s.yaml
  # Classification - transformers
  - models/vit.yaml
  - models/swin_tiny.yaml
  - models/beit.yaml
  - models/sequencer2d.yaml
  - models/mobile_vit.yaml
  # Detection
  - models/yolov5.yaml
  - models/yolov8_det.yaml
  - models/yolov8_seg.yaml
  - models/yolov11_det.yaml
  - models/yolov3.yaml
  - models/yolov10_det.yaml

  # Segmentation
  - models/deeplabv3_plus_mobilenet.yaml
  - models/fcn_resnet50.yaml
  - models/mediapipe_selfie.yaml
  - models/segformer_base.yaml
  - models/ddrnet23_slim.yaml
  - models/pidnet.yaml
  - models/ffnet_40s.yaml
  - models/dla102x.yaml

  - models/unet_segmentation.yaml
  # Depth estimation
  # Pose estimation
  - models/hrnet_pose.yaml

compare_to_baseline: true
baseline_file: "baselines/nightly-torch_latest.json"
