# Weekly Regression Suite - AIMET Torch
#
# Purpose: Comprehensive weekly regression with QNN on-device testing
# Target Duration: 4-6 hours
# When: Every Saturday at 6 AM UTC (parallel with weekly-onnx)

suite_name: weekly-torch

profile: weekly

framework: torch

models:
  # Tier-1 (nightly models)
  - models/resnet50.yaml
  - models/mobilenetv2.yaml
  - models/efficientnet_b0.yaml
  - models/densenet121.yaml
  - models/mobilenet_v3_large.yaml
  - models/vit.yaml
  - models/swin_tiny.yaml
  - models/squeezenet1_1.yaml
  - models/levit.yaml
  # Detection & segmentation
  - models/yolov5.yaml
  - models/yolov8_seg.yaml
  - models/yolov8_det.yaml
  - models/deeplabv3_plus_mobilenet.yaml
  - models/fcn_resnet50.yaml
  - models/segformer_base.yaml
  # Additional architectures
  - models/inception_v3.yaml
  - models/convnext_tiny.yaml
  - models/regnetx_004.yaml
  - models/wideresnet50.yaml
  - models/hrnet_pose.yaml

compare_to_baseline: true
baseline_file: "baselines/weekly-torch_latest.json"