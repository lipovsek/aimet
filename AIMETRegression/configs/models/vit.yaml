# vit Model Configuration

# ==================== Model Identification ====================
model_name: vit

# ==================== Test Definitions ====================
tests:
  # --------------------------------------------------------------------------
  # Test 1: W8A8 + Lite-MP (10% FP16)
  # --------------------------------------------------------------------------

  - name: lite_mp_10
    feature: lite_mp
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    max_accuracy_drop: 4.5

  - name: quantsim_int8_v79
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    max_accuracy_drop_torch: 8.5
    max_accuracy_drop_onnx: 10.9
    apply_experimental_static_aten_calibration: true

  # --------------------------------------------------------------------------
  # Test 3: Automatic Mixed-Precision (INT8 + FP16, Fast)
  # --------------------------------------------------------------------------

  - name: amp_int8_fp16_fast
    feature: mixed_precision
    candidates: int8_fp16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v79
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop: 8.5
