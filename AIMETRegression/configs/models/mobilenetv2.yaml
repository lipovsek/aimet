model_name: mobilenet_v2
qnn_options: "--target_runtime qnn_dlc --output_names class_logits --force_channel_last_input image_tensor"

tests:
  - name: amp_int8_int16
    feature: mixed_precision
    candidates: int8_int16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v81
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop_torch: 1.6
    skip_torch: true
