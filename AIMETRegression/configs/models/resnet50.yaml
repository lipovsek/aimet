# ResNet50 Model Configuration

# Each test inherits settings from:
#   1. _defaults.yaml (base settings)
#   2. Profile (e.g., nightly.yaml) if specified
#   3. This file (model-level settings)
#   4. Test-specific settings below

# ==================== Model Identification ====================
model_name: resnet50

# ==================== Test Definitions ====================
# Each test is a different quantization configuration
# Suite files can filter which tests to run using test_filter

tests:
  # --------------------------------------------------------------------------
  # Test 1: Standard INT8 Quantization
  # --------------------------------------------------------------------------

  - name: quantsim_int8
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    apply_experimental_static_aten_calibration: true

  # --------------------------------------------------------------------------
  # Test 2: INT8/INT16 Mixed Precision
  # --------------------------------------------------------------------------

  - name: quantsim_int8_int16
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int16
    config_file: htp_v81
    apply_experimental_static_aten_calibration: true

  # --------------------------------------------------------------------------
  # Test 3: Lite Mixed-Precision (25% FP16)
  # --------------------------------------------------------------------------

  - name: lite_mp_25
    feature: lite_mp
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    lite_mp:
      percent_flip: 25
      override_precision: float16
    max_accuracy_drop: 1.0

  # --------------------------------------------------------------------------
  # Test 4: AdaRound Optimization (500 iterations)
  # --------------------------------------------------------------------------

  - name: adaround_500
    feature: adaround
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    adaround_iters: 500
    max_accuracy_drop: 1.0

  # --------------------------------------------------------------------------
  # Test 5: Automatic Mixed-Precision (INT8 + FP16, Fast)
  # --------------------------------------------------------------------------
  # Uses AIMET's automatic mixed precision with SQNR-based Phase 1 pruning
  # for fast candidate elimination, followed by accuracy-based Phase 2 selection

  - name: amp_int8_fp16_fast
    feature: mixed_precision
    candidates: int8_fp16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v79
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop: 1.0

  # --------------------------------------------------------------------------
  # Test 6: Automatic Mixed-Precision (INT4 + INT8 + FP16)
  # --------------------------------------------------------------------------

  - name: amp_int4_int8_fp16
    feature: mixed_precision
    candidates: int4_int8_fp16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.02
    config_file: htp_v79
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop: 1.0

  # --------------------------------------------------------------------------
  # Test 7: W4A16 (low-bit weights, high-bit activations)
  # --------------------------------------------------------------------------

  - name: quantsim_w4a16
    feature: quantsim
    quant_scheme: min_max
    param_type: int4
    activation_type: int16
    config_file: htp_v79
