model_name: convnext_tiny
qnn_options: null

tests:
  - name: quantsim_int8
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79

  - name: lite_mp_25
    feature: lite_mp
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    lite_mp:
      percent_flip: 25
      override_precision: float16

  - name: amp_int8_fp16_fast
    feature: mixed_precision
    candidates: int8_fp16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v79
    calib_samples: 256
    eval_samples: 256
