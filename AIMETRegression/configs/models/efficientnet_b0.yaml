# EfficientNet-B0 Model Configuration

# ==================== Model Identification ====================
model_name: efficientnet_b0

# ==================== Test Definitions ====================
tests:
  # --------------------------------------------------------------------------
  # Test: LiteMP w8a8 + 15% int16
  # --------------------------------------------------------------------------

  - name: lite_mp_15
    feature: lite_mp
    lite_mp:
      percent_flip: 15
      override_precision: int16
      eval_samples: 5
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79

  - name: quantsim_int8_int16
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int16
    config_file: htp_v81
    apply_experimental_static_aten_calibration: true

  # --------------------------------------------------------------------------
  # Test 3: AdaRound Optimization (500 iterations)
  # --------------------------------------------------------------------------

  - name: adaround_500
    feature: adaround
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    adaround_iters: 500

  # --------------------------------------------------------------------------
  # Test 4: Lite Mixed-Precision (25% FP16)
  # --------------------------------------------------------------------------

  - name: lite_mp_25
    feature: lite_mp
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    lite_mp:
      percent_flip: 25
      override_precision: float16

  # --------------------------------------------------------------------------
  # Test 5: Automatic Mixed-Precision (INT8 + FP16, Fast)
  # --------------------------------------------------------------------------

  - name: amp_int8_fp16_fast
    feature: mixed_precision
    candidates: int8_fp16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v79
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop_torch: 7.7
